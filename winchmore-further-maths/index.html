<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Winchmore AQA Level 2 Further Maths</title>
<style>
:root{--ink:#1b1f3b;--bg:#f4f6ff;--card:#fff;--pri:#5b2eff;--pink:#ff3d7f;--yel:#ffc928;--grn:#12b886;--mut:#5f6683}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:linear-gradient(120deg,var(--pri),var(--pink));color:#fff;padding:28px 20px 34px}
header h1{margin:0 0 4px;font-size:clamp(22px,5vw,34px)}header p{margin:0;opacity:.92}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.weeks{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:thin}
.weeks button{flex:0 0 auto;border:0;border-radius:999px;padding:8px 14px;background:#fff;color:var(--ink);font-weight:600;cursor:pointer;box-shadow:0 1px 3px #0002}
.weeks button[aria-pressed=true]{background:var(--ink);color:#fff}.weeks button.now{outline:3px solid var(--yel)}
.card{background:var(--card);border-radius:16px;padding:18px 20px;margin:14px 0;box-shadow:0 2px 10px #1b1f3b14}
.card h2{margin:0 0 4px}.date{color:var(--mut);font-size:14px}
.tag{display:inline-block;background:var(--yel);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700;margin-left:6px}
h3{margin:0 0 10px;font-size:17px;color:var(--pri)}
ul{margin:0;padding-left:20px}li{margin:4px 0}
.dl{display:flex;flex-wrap:wrap;gap:10px}
.dl a{text-decoration:none;color:#fff;font-weight:700;padding:10px 16px;border-radius:12px}
.a1{background:var(--pink)}.a2{background:var(--grn)}.a3{background:var(--pri)}
.q{border-top:1px solid #e6e8f5;padding:10px 0}.q:first-of-type{border-top:0}
.q button{border:0;background:#eef0ff;color:var(--pri);font-weight:700;border-radius:8px;padding:5px 10px;cursor:pointer;margin-top:6px}
.ans{display:none;background:#eafff6;border-left:4px solid var(--grn);padding:8px 10px;border-radius:6px;margin-top:6px}
.ans.show{display:block}.marks{color:var(--mut);font-size:13px;white-space:nowrap}
.step{display:none;padding:4px 0}.step.show{display:block}
.empty{color:var(--mut)}footer{color:var(--mut);font-size:13px;text-align:center;padding:30px 16px}
</style></head><body>

<script>
const WEEKS=[{"w": 1, "d": "2026-10-20", "s": "num", "t": "Surds and indices", "obj": ["Simplify surds and rationalise denominators", "Use negative and fractional indices"], "st": [["Evaluate 9^{1/2}", "3"], ["Simplify √50", "5√2"], ["Write 2^{−3} as a fraction", "1/8"]], "key": ["√(ab) = √a × √b and √(a/b) = √a / √b", "1/√a = √a / a (multiply top and bottom by √a)", "For 1/(a + √b) multiply top and bottom by (a − √b)", "a^{−n} = 1/a^{n} and a^{m/n} = (ⁿ√a)^{m}: root first, then power"], "ex": {"q": "Rationalise and simplify 6 / (3 − √3)", "steps": ["Multiply top and bottom by (3 + √3)", "Denominator: (3 − √3)(3 + √3) = 9 − 3 = 6", "6(3 + √3) / 6 = 3 + √3"]}, "pr": [["Simplify √75 + √12", "7√3"], ["Evaluate 27^{−2/3}", "1/9"], ["Rationalise 10/√5", "2√5"]], "exit": ["Write (√2 + 3)(√2 − 1) in the form a + b√2", "−1 + 2√2"], "qs": [["Show that (5 + √3)/(2 − √3) can be written as a + b√3, where a and b are integers.", 3, "Multiply by (2 + √3)/(2 + √3) M1. Numerator 10 + 5√3 + 2√3 + 3 A1. Denominator 4 − 3 = 1, so <b>13 + 7√3</b> A1."], ["Solve 8^{x} = 4^{x+1}", 3, "2^{3x} = 2^{2x+2} M1, 3x = 2x + 2 M1, <b>x = 2</b> A1."], ["Simplify fully (16x⁸)^{3/4}", 2, "16^{3/4} = 8 B1, x⁶ B1. <b>8x⁶</b>"]]}, {"w": 2, "d": "2026-11-03", "s": "alg", "t": "Expanding brackets and the binomial expansion", "obj": ["Expand the product of three brackets", "Expand (a + b)ⁿ using Pascal's triangle"], "st": [["Expand (x + 3)(x − 2)", "x² + x − 6"], ["Expand (2x − 1)²", "4x² − 4x + 1"], ["Write down row 4 of Pascal's triangle", "1 4 6 4 1"]], "key": ["Three brackets: multiply two together first, then multiply by the third", "Pascal's triangle gives the coefficients of (a + b)ⁿ", "Powers of a go down from n to 0 while powers of b go up from 0 to n", "Put brackets round terms like (2x) and (−3x) before raising to a power"], "ex": {"q": "Expand (2 + x)⁴ fully", "steps": ["Row 4: 1, 4, 6, 4, 1", "1(2⁴) + 4(2³)x + 6(2²)x² + 4(2)x³ + x⁴", "= 16 + 32x + 24x² + 8x³ + x⁴"]}, "pr": [["Expand (x + 1)(x + 2)(x + 3)", "x³ + 6x² + 11x + 6"], ["Expand (1 − x)³", "1 − 3x + 3x² − x³"], ["Find the coefficient of x² in (1 + 2x)⁵", "10 × 2² = 40"]], "exit": ["Expand (x − 2)³", "x³ − 6x² + 12x − 8"], "qs": [["Expand and simplify (x + 2)(x − 3)(2x + 1)", 3, "(x² − x − 6) M1, multiply by (2x + 1) M1, <b>2x³ − x² − 13x − 6</b> A1."], ["Find the term in x³ in the expansion of (3 − 2x)⁵", 2, "Coefficient 10 from row 5 M1. 10 × 3² × (−2x)³ = <b>−720x³</b> A1."], ["The coefficient of x² in the expansion of (1 + ax)⁴ is 54. Given a > 0, find a.", 3, "6 × (ax)² M1, 6a² = 54 M1, <b>a = 3</b> A1."]], "dl": {"ppt": "decks/FM_Week2_Binomial_Expansion.pptx", "vid": "videos/FM_Week2_Revision_Video.mp4", "pdf": "exams/FM_Week2_Exam_Questions.pdf"}}, {"w": 3, "d": "2026-11-10", "s": "alg", "t": "Factorising and algebraic fractions", "obj": ["Factorise harder quadratics and differences of squares", "Simplify, add and solve with algebraic fractions"], "st": [["Factorise x² + 5x + 6", "(x + 2)(x + 3)"], ["Factorise 2x² + 7x + 3", "(2x + 1)(x + 3)"], ["Factorise x² − 49", "(x + 7)(x − 7)"]], "key": ["Always take out a common factor first", "ax² + bx + c: find two numbers that multiply to ac and add to b, then group", "Factorise top and bottom, then cancel common factors, never terms", "Add fractions over a common denominator; to solve, multiply every term by it"], "ex": {"q": "Simplify (2x² + 5x − 3)/(x² − 9)", "steps": ["Top: (2x − 1)(x + 3)", "Bottom: (x + 3)(x − 3)", "Cancel (x + 3): (2x − 1)/(x − 3)"]}, "pr": [["Factorise fully 3x² − 12", "3(x − 2)(x + 2)"], ["Simplify (x² − 4x)/(x² − 16)", "x/(x + 4)"], ["Write 2/(x + 1) + 3/(x − 2) as a single fraction", "(5x − 1)/((x + 1)(x − 2))"]], "exit": ["Factorise 6x² − x − 2", "(3x − 2)(2x + 1)"], "qs": [["Simplify fully (x² + 2x − 15)/(2x² − 7x + 3)", 3, "(x + 5)(x − 3) B1, (2x − 1)(x − 3) B1, <b>(x + 5)/(2x − 1)</b> A1."], ["Solve 3/(x − 1) − 2/(x + 1) = 1", 5, "Multiply by (x − 1)(x + 1) M1. 3(x + 1) − 2(x − 1) = x² − 1 M1. x² − x − 6 = 0 A1. (x − 3)(x + 2) = 0 M1. <b>x = 3 or x = −2</b> A1."], ["Factorise fully x⁴ − 16", 2, "(x² + 4)(x² − 4) M1, <b>(x² + 4)(x + 2)(x − 2)</b> A1."]], "dl": {"ppt": "decks/FM_Week3_Factorising_Algebraic_Fractions.pptx", "vid": "videos/FM_Week3_Revision_Video.mp4", "pdf": "exams/FM_Week3_Exam_Questions.pdf"}}, {"w": 4, "d": "2026-11-17", "s": "alg", "t": "The factor theorem", "obj": ["Use f(a) = 0 to find a factor", "Factorise and solve cubic equations"], "st": [["f(x) = x³ − 2x + 1. Find f(2)", "5"], ["Find f(−1)", "2"], ["Is x = 1 a root?", "Yes, f(1) = 0"]], "key": ["If f(a) = 0 then (x − a) is a factor of f(x)", "For (ax − b), test f(b/a)", "Try factors of the constant term: ±1, ±2, ±3 …", "Once you have one factor, find the quadratic factor and factorise it"], "ex": {"q": "Factorise fully x³ − 2x² − 5x + 6", "steps": ["f(1) = 1 − 2 − 5 + 6 = 0, so (x − 1) is a factor", "x³ − 2x² − 5x + 6 = (x − 1)(x² − x − 6)", "= (x − 1)(x − 3)(x + 2)"]}, "pr": [["Show (x + 2) is a factor of x³ + x² − 4x − 4 and factorise fully", "f(−2) = 0; (x + 1)(x − 2)(x + 2)"], ["Solve x³ − 7x + 6 = 0", "x = 1, 2, −3"], ["(x − 3) is a factor of x³ − kx + 3. Find k", "k = 10"]], "exit": ["Is (2x − 1) a factor of 2x³ + x² − x?", "Yes: f(½) = 0"], "qs": [["(x − 2) is a factor of x³ + ax² − x − 2. (a) Find a. (b) Show that x³ + ax² − x − 2 = 0 has only one real root.", 5, "(a) 8 + 4a − 2 − 2 = 0 M1, <b>a = −1</b> A1. (b) (x − 2)(x² + x + 1) M1. Discriminant 1 − 4 = −3 &lt; 0 M1, so x² + x + 1 = 0 has no real roots; only root x = 2 A1."], ["Solve 2x³ − 3x² − 11x + 6 = 0", 5, "f(3) = 0 M1 A1. (x − 3)(2x² + 3x − 2) M1. (x − 3)(2x − 1)(x + 2) A1. <b>x = 3, ½, −2</b> A1."]], "dl": {"ppt": "decks/FM_Week4_Factor_Theorem.pptx", "vid": "videos/FM_Week4_Revision_Video.mp4", "pdf": "exams/FM_Week4_Exam_Questions.pdf"}}, {"w": 5, "d": "2026-11-24", "s": "alg", "t": "Quadratic and simultaneous equations", "obj": ["Complete the square and use the discriminant", "Solve one linear and one quadratic equation simultaneously"], "st": [["Solve x² − 5x + 4 = 0", "x = 1, 4"], ["Complete the square: x² + 6x + 2", "(x + 3)² − 7"], ["Discriminant of x² + x + 1", "−3"]], "key": ["a(x + p)² + q: the minimum (or maximum) is q at x = −p", "b² − 4ac &gt; 0 two roots, = 0 one repeated root, &lt; 0 no real roots", "Quadratic formula when it will not factorise", "Simultaneous: substitute the linear equation into the quadratic, then pair x with y"], "ex": {"q": "Solve y = x + 1 and x² + y² = 13", "steps": ["x² + (x + 1)² = 13", "2x² + 2x − 12 = 0, so x² + x − 6 = 0", "(x + 3)(x − 2) = 0: x = 2, y = 3 or x = −3, y = −2"]}, "pr": [["Solve 2x² − 3x − 4 = 0 to 2 d.p.", "x = 2.35 or −0.85"], ["Write 2x² + 8x + 3 as a(x + b)² + c", "2(x + 2)² − 5"], ["Solve y = 2x − 1 and y = x² − 4x + 4", "(1, 1) and (5, 9)"]], "exit": ["For which k does x² + kx + 9 = 0 have equal roots?", "k = ±6"], "qs": [["Solve simultaneously x + 2y = 5 and x² + y² = 10", 6, "x = 5 − 2y M1. (5 − 2y)² + y² = 10 M1. 5y² − 20y + 15 = 0 A1. (y − 1)(y − 3) = 0 M1. <b>x = 3, y = 1 and x = −1, y = 3</b> A1 A1."], ["Write x² − 8x + 21 in the form (x + a)² + b. Hence state the minimum value of x² − 8x + 21 and the value of x where it occurs.", 3, "<b>(x − 4)² + 5</b> B1 B1. <b>Minimum 5 when x = 4</b> B1."], ["The line y = kx − 1 is a tangent to the curve y = x². Find the possible values of k.", 4, "x² − kx + 1 = 0 M1. One root, so b² − 4ac = 0 M1. k² − 4 = 0 A1. <b>k = 2 or k = −2</b> A1."]]}, {"w": 6, "d": "2026-12-01", "s": "alg", "t": "Inequalities and algebraic proof", "obj": ["Solve linear and quadratic inequalities", "Write a clear algebraic proof"], "st": [["Solve 3x − 5 &gt; 7", "x &gt; 4"], ["Solve −2x ≤ 6", "x ≥ −3"], ["List the integers n with −2 &lt; n ≤ 3", "−1, 0, 1, 2, 3"]], "key": ["Multiplying or dividing by a negative reverses the inequality", "Quadratic: find the roots, sketch, then read off the region", "Below the axis (&lt; 0) is between the roots; above (&gt; 0) is outside them", "Proof: even 2n, odd 2n + 1, consecutive n and n + 1; finish with a sentence"], "ex": {"q": "Solve x² − x − 12 &lt; 0", "steps": ["(x − 4)(x + 3) = 0 gives roots 4 and −3", "Sketch: the curve is below the axis between the roots", "−3 &lt; x &lt; 4"]}, "pr": [["Solve x² ≥ 9", "x ≤ −3 or x ≥ 3"], ["Solve 2x² + 5x − 3 &gt; 0", "x &lt; −3 or x &gt; ½"], ["Prove the sum of three consecutive integers is a multiple of 3", "n + (n + 1) + (n + 2) = 3(n + 1)"]], "exit": ["Prove (2n + 1)² − (2n − 1)² is a multiple of 8", "= 8n"], "qs": [["Solve 3x² ≤ 5x + 2", 3, "3x² − 5x − 2 ≤ 0 M1. (3x + 1)(x − 2) M1. <b>−⅓ ≤ x ≤ 2</b> A1."], ["Prove that the square of any odd number is one more than a multiple of 8.", 4, "(2n + 1)² M1 = 4n² + 4n + 1 A1 = 4n(n + 1) + 1 M1. n(n + 1) is even, so 4n(n + 1) is a multiple of 8 A1."], ["Prove that x² − 6x + 11 &gt; 0 for all values of x.", 3, "(x − 3)² + 2 M1 A1. (x − 3)² ≥ 0 so expression ≥ 2 &gt; 0 A1."]]}, {"w": 7, "d": "2026-12-08", "s": "coord", "t": "Coordinate geometry of straight lines", "obj": ["Find gradients, midpoints, distances and ratios", "Use parallel and perpendicular gradients"], "st": [["Gradient from (1, 2) to (3, 8)", "3"], ["Midpoint of (−2, 5) and (4, 1)", "(1, 3)"], ["Gradient of 2y = 4x + 3", "2"]], "key": ["Gradient m = (y₂ − y₁)/(x₂ − x₁); line: y − y₁ = m(x − x₁)", "Parallel lines have equal gradients; perpendicular: m₁ × m₂ = −1", "Distance = √((x₂ − x₁)² + (y₂ − y₁)²)", "Point dividing AB in ratio m : n is A + m/(m + n) of the way to B"], "ex": {"q": "Find the line through (2, −1) perpendicular to y = 2x + 5", "steps": ["Perpendicular gradient = −½", "y + 1 = −½(x − 2)", "y = −½x, or x + 2y = 0"]}, "pr": [["Distance from (1, 1) to (7, 9)", "10"], ["P divides A(1, 2) to B(10, 14) in ratio 1 : 2. Find P", "(4, 6)"], ["Line through (0, 3) and (4, −5)", "y = −2x + 3"]], "exit": ["Are 3x + 2y = 6 and 2x − 3y = 1 perpendicular?", "Yes: −3/2 × 2/3 = −1"], "qs": [["A is (−1, 4) and B is (5, −2). Find the equation of the perpendicular bisector of AB in the form ax + by = c.", 4, "Midpoint (2, 1) B1. Gradient AB = −1 B1. Perpendicular gradient 1 M1. <b>x − y = 1</b> A1."], ["P is (−4, 0). C(2, 3) lies on the line PQ with PC : CQ = 3 : 1. Find the coordinates of Q.", 3, "PC = (6, 3) M1. PQ = 4/3 × (6, 3) = (8, 4) M1. <b>Q = (4, 4)</b> A1."], ["O is (0, 0), A is (4, 2) and B is (2, 6). Show that triangle OAB is right-angled and find its area.", 4, "m(OA) = ½, m(AB) = −2 M1, product −1 so right angle at A A1. OA = AB = √20 M1. Area = ½ × 20 = <b>10</b> A1."]]}, {"w": 8, "d": "2026-12-15", "s": "test", "t": "Checkpoint A (in-class test)", "obj": ["Sit a 30-minute test on weeks 1–7", "Self-mark and set two targets"], "st": [["Clear desks: pen, pencil, ruler only", "Non-calculator"], ["Write name and date at the top", "—"], ["Read every question before starting", "—"]], "key": ["30 minutes, 21 marks: about 1 minute per mark plus checking", "Show every step; method marks are awarded even if the answer is wrong", "'Show that' questions need every line written", "Questions are in the Exam questions tab under Week 8"], "ex": {"q": "How to lay out a 'show that' answer", "steps": ["Start from the left-hand side, not the answer", "Write one step per line with = signs lined up", "Finish by writing the result you were asked to show"]}, "pr": [["Sit the test: questions 1 to 7", "30 minutes"], ["Self-mark with the mark scheme", "Different colour pen"], ["Total your marks", "Out of 21"]], "exit": ["Write two targets from the topics you lost marks on", "e.g. 'rationalising with brackets'"], "qs": [["Simplify √48 − √12", 2, "4√3 − 2√3 M1, <b>2√3</b> A1."], ["Rationalise the denominator of 4/(√5 − 1)", 3, "Multiply by (√5 + 1) M1. Denominator 4 A1. <b>√5 + 1</b> A1."], ["Expand (1 + 3x)⁴ fully", 3, "Row 1 4 6 4 1 M1. <b>1 + 12x + 54x² + 108x³ + 81x⁴</b> A2 (A1 for three correct terms)."], ["Show that (x + 1) is a factor of x³ − 3x² − x + 3 and factorise fully.", 4, "f(−1) = −1 − 3 + 1 + 3 = 0 M1 A1. <b>(x − 3)(x − 1)(x + 1)</b> M1 A1."], ["Solve x² + 2x − 15 &gt; 0", 3, "(x + 5)(x − 3) M1, critical values −5, 3 A1, <b>x &lt; −5 or x &gt; 3</b> A1."], ["L passes through (1, 5) and (3, 1). Find the line perpendicular to L through the origin.", 3, "m(L) = −2 B1, perpendicular ½ M1, <b>y = ½x</b> A1."], ["Prove that the difference between the squares of two consecutive integers is always odd.", 3, "(n + 1)² − n² M1 = 2n + 1 A1. 2n is even so 2n + 1 is odd A1."]]}, {"w": 9, "d": "2027-01-05", "s": "coord", "t": "Equations of circles", "obj": ["Use (x − a)² + (y − b)² = r²", "Find tangents to a circle"], "st": [["Distance from (0, 0) to (3, 4)", "5"], ["Complete the square: x² − 6x", "(x − 3)² − 9"], ["Perpendicular gradient to ¾", "−4/3"]], "key": ["Centre (a, b), radius r: (x − a)² + (y − b)² = r²", "Centre the origin: x² + y² = r²", "A tangent is perpendicular to the radius at the point of contact", "Complete the square in x and in y to find the centre and radius"], "ex": {"q": "Find the centre and radius of x² + y² − 4x + 6y − 12 = 0", "steps": ["(x − 2)² − 4 + (y + 3)² − 9 − 12 = 0", "(x − 2)² + (y + 3)² = 25", "Centre (2, −3), radius 5"]}, "pr": [["Circle with centre (1, −2) through (4, 2)", "(x − 1)² + (y + 2)² = 25"], ["Tangent to x² + y² = 25 at (3, 4)", "3x + 4y = 25"], ["Is (5, 1) inside x² + y² = 25?", "No: 26 &gt; 25, outside"]], "exit": ["Centre and radius of (x + 4)² + y² = 7", "(−4, 0), √7"], "qs": [["A is (−2, 1) and B is (6, 7). AB is a diameter of a circle. Find the equation of the circle.", 4, "Centre (2, 4) B1. AB = 10 M1, radius 5 A1. <b>(x − 2)² + (y − 4)² = 25</b> A1."], ["P(6, 8) lies on the circle x² + y² = 100. Find the equation of the tangent at P in the form y = mx + c.", 3, "Gradient OP = 4/3 B1, tangent −¾ M1. <b>y = −¾x + 12.5</b> A1."], ["Find the points where the line y = x − 1 meets the circle x² + y² = 25.", 5, "x² + (x − 1)² = 25 M1. 2x² − 2x − 24 = 0 A1. (x − 4)(x + 3) = 0 M1. <b>(4, 3) and (−3, −4)</b> A1 A1."]]}, {"w": 10, "d": "2027-01-12", "s": "fun", "t": "Functions: const nice=d=>new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
const today=new Date().toISOString().slice(0,10);
let cur=WEEKS.filter(w=>w.d<=today).pop()||WEEKS[0];
const hashW=parseInt((location.hash.match(/w(\d+)/)||[])[1]);if(hashW)cur=WEEKS.find(w=>w.w===hashW)||cur;
const nowW=(WEEKS.filter(w=>w.d<=today).pop()||WEEKS[0]).w;
function qa(list,label){return list.map((x,i)=>`<div class="q"><b>${i+1}.</b> ${x[0]}<br><button data-t>${label}</button><div class="ans">${x[1]}</div></div>`).join('')}
function exam(qs){return qs.filter(q=>q[1]).map((q,i)=>`<div class="q"><b>${i+1}.</b> ${q[0]} <span class="marks">(${q[1]} mark${q[1]>1?'s':''})</span><br><button data-t>Show mark scheme</button><div class="ans">${q[2]}</div></div>`).join('')}
function render(){
 document.getElementById('weeks').innerHTML=WEEKS.map(w=>`<button class="${w.w===nowW?'now':''}" aria-pressed="${w.w===cur.w}" data-w="${w.w}">Wk ${w.w}</button>`).join('');
 const w=cur,future=w.d>today;
 let h=`<div class="card"><h2>Week ${w.w}: ${w.t}${w.w===nowW?'<span class="tag">This week</span>':''}</h2><div class="date">${nice(w.d)}</div></div>`;
 if(w.dl)h+=`<div class="card"><h3>Downloads</h3><div class="dl"><a class="a1" href="${w.dl.ppt}" download>PowerPoint</a><a class="a2" href="${w.dl.vid}" download>Revision video</a><a class="a3" href="${w.dl.pdf}" download>Exam questions (PDF)</a></div></div>`;
 h+=`<div class="card"><h3>Learning objectives</h3><ul>${w.obj.map(o=>`<li>${o}</li>`).join('')}</ul></div>`;
 if(future){h+=`<div class="card"><p class="empty">The full lesson opens on ${nice(w.d)}.</p></div>`}
 else{
  if(w.key&&w.key.length)h+=`<div class="card"><h3>Key facts</h3><ul>${w.key.map(k=>`<li>${k}</li>`).join('')}</ul></div>`;
  if(w.ex&&w.ex.q)h+=`<div class="card"><h3>Worked example</h3><p><b>${w.ex.q}</b></p>${w.ex.steps.map((s,i)=>`<div class="step">Step ${i+1}: ${s}</div>`).join('')}<button class="q" style="border:0;background:#eef0ff;color:var(--pri);font-weight:700;border-radius:8px;padding:6px 12px;cursor:pointer" id="nx">Next step</button></div>`;
  if(w.pr&&w.pr.length)h+=`<div class="card"><h3>Practice</h3>${qa(w.pr,'Show answer')}</div>`;
  if(w.qs&&w.qs.some(q=>q[1]))h+=`<div class="card"><h3>Homework: exam questions</h3>${exam(w.qs)}</div>`;
 }
 document.getElementById('main').innerHTML=h;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const a=b.nextElementSibling;a.classList.toggle('show');b.textContent=a.classList.contains('show')?b.textContent.replace('Show','Hide'):b.textContent.replace('Hide','Show')});
 const nx=document.getElementById('nx');if(nx)nx.onclick=()=>{const s=[...document.querySelectorAll('.step:not(.show)')];if(s[0])s[0].classList.add('show');if(s.length<=1)nx.style.display='none'};
 document.querySelectorAll('#weeks button').forEach(b=>b.onclick=()=>{cur=WEEKS.find(x=>x.w==b.dataset.w);history.replaceState(null,'','#w'+cur.w);render();scrollTo(0,0)});
 const a=document.querySelector('#weeks [aria-pressed=true]');if(a)a.scrollIntoView({inline:'center',block:'nearest'});
}
render();
</script></body></html>
