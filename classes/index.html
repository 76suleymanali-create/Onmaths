<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maths Lessons</title><style>
:root{--ink:#1b1f3b;--bg:#f4f6ff;--pri:#0b7cff;--pink:#ff3d7f;--yel:#ffc928;--grn:#12b886;--mut:#5f6683}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,var(--pri),var(--grn));color:#fff;padding:26px 18px 30px}header h1{margin:0;font-size:clamp(22px,5vw,32px)}header p{margin:4px 0 0;opacity:.9}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:18px 0}
.cls a{background:#fff;border-radius:14px;padding:18px;text-decoration:none;color:var(--ink);font-weight:700;box-shadow:0 2px 8px #0001;border-left:6px solid var(--pink)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:16px 0}
.nav button{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}.nav button:disabled{opacity:.3}
.wk{font-weight:700;text-align:center}.tag{background:var(--yel);border-radius:6px;padding:1px 7px;font-size:12px;margin-left:6px}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:0 2px 8px #0001;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.date{color:var(--mut);font-size:13px}.t{font-weight:600}.k-t{border-left:5px solid var(--pink)}.k-r{border-left:5px solid var(--yel)}.k-x{opacity:.6}
.card a{background:var(--grn);color:#fff;text-decoration:none;font-weight:700;padding:8px 12px;border-radius:10px;white-space:nowrap}
.back{color:#fff;text-decoration:none;font-size:14px;opacity:.9}.empty{color:var(--mut)}
.tt{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #0001;margin:10px 0 18px;font-size:14px}
.tt th,.tt td{padding:8px 6px;text-align:center;border-bottom:1px solid #eef}.tt th{background:var(--ink);color:#fff}.tt td.on{background:#e6f9f1;font-weight:700}
h2{font-size:18px;margin:18px 0 6px}.btns{display:flex;gap:8px;flex-wrap:wrap}.card a.p{background:var(--pink)}
.ttlink{display:inline-block;margin:6px 0 4px;background:var(--ink);color:#fff;text-decoration:none;padding:10px 16px;border-radius:12px;font-weight:700}
</style></head><body>
